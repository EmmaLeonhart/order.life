<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <title>命 as Alo Nine</title>
  <!-- Roof (亼): a one-level Sierpinski triangle in Alo Nine's green; its base is the 一 stroke -->
  <g fill="#007f00" stroke="#000" stroke-width="0.8" stroke-linejoin="round">
    <polygon points="50,4 31,25 69,25"/>
    <polygon points="31,25 12,46 50,46"/>
    <polygon points="69,25 50,46 88,46"/>
  </g>
  <!-- 口 at bottom-left, in Alo Nine's maroon -->
  <path fill="#7f0000" stroke="#000" stroke-width="0.8" fill-rule="evenodd"
        d="M19 55 H46 V87 H19 Z M26 62 V80 H39 V62 Z"/>
  <!-- 卩 at bottom-right, in Alo Nine's navy -->
  <path fill="#00007f" stroke="#000" stroke-width="0.8" stroke-linejoin="round"
        d="M55 55 H84 V77 L78 83 L72 80 L77 75 V62 H62 V97 H55 Z"/>
</svg>
