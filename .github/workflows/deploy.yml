name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
    paths-ignore:
      - "discord-bot/state.json"
      - "wiki-pages/**"
      - "Gaiad/epic/compiled/**"
      - "gaiad_full.md"
      - "gaiad_full_readable.md"
  schedule:
    - cron: "5 7 * * *"   # 00:05 Pacific in summer (PDT): the new day reaches the site at midnight
    - cron: "5 8 * * *"   # 00:05 Pacific in winter (PST)
    - cron: "0 16 * * *"  # Daily at 8:00 AM PST (16:00 UTC), before Discord bot at 8:30 AM PST
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - run: pip install -r requirements.txt

      - run: python build.py

      # The downloads (Emma, 2026-10-14): the English Gaiad as PDF and EPUB, and a zip holding them
      # with the GEDCOM. The zip is a GEDZIP (GEDCOM 7's package: gedcom.ged at the root, media files
      # beside it by relative path), so genealogy programs can open it and attachments can follow.
      - name: Install pandoc and Typst
        run: |
          curl -sSfL -o /tmp/pandoc.deb https://github.com/jgm/pandoc/releases/download/3.12.1/pandoc-3.12.1-1-amd64.deb
          sudo dpkg -i /tmp/pandoc.deb
          curl -sSfL https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz | tar -xJ -C /tmp
          sudo mv /tmp/typst-x86_64-unknown-linux-musl/typst /usr/local/bin/
          pandoc --version | head -1 && typst --version

      - name: Build the PDF, the EPUB and the zip
        run: |
          python scripts/build_book.py /tmp/gaiad_book.md
          pandoc /tmp/gaiad_book.md -f markdown+hard_line_breaks --toc --toc-depth=2 -o site/gaiad.epub
          # One book, two formats (Emma, 2026-10-15: "the PDF would be built from the EPUB"): the PDF is made from the EPUB.
          # The filter drops the EPUB's hidden navigation; the subtitle is not carried through the EPUB, so it is passed again.
          pandoc site/gaiad.epub -f epub --lua-filter scripts/epub_to_pdf.lua --toc --toc-depth=1 --pdf-engine=typst -M subtitle="Scripture of Lifeism, one chapter for each day of the Gaian year" -o site/gaiad.pdf
          # "all these other formats" (Emma, 2026-10-14): Word, OpenDocument and plain text beside PDF and EPUB.
          pandoc /tmp/gaiad_book.md -f markdown+hard_line_breaks --toc --toc-depth=2 -o site/gaiad.docx
          pandoc /tmp/gaiad_book.md -f markdown+hard_line_breaks --toc --toc-depth=2 -o site/gaiad.odt
          pandoc /tmp/gaiad_book.md -f markdown+hard_line_breaks -t plain -s --wrap=none -o site/gaiad.txt
          mkdir -p /tmp/gaiad-zip
          # the one GEDCOM, packaged with the books, with everyone's coat of arms in media/arms/ (wiki-scripts/gedcom_arms.py)
          python wiki-scripts/gedcom_arms.py site/gaiad.ged /tmp/gaiad-zip/gedcom.ged /tmp/gaiad-zip
          python wiki-scripts/gedcom_portraits.py /tmp/gaiad-zip/gedcom.ged /tmp/gaiad-zip/gedcom.ged /tmp/gaiad-zip
          cp site/gaiad.pdf site/gaiad.epub site/gaiad.docx site/gaiad.odt site/gaiad.txt /tmp/gaiad-zip/
          (cd /tmp/gaiad-zip && zip -q -r -9 "$GITHUB_WORKSPACE/site/gaiad.zip" .)
          ls -la site/gaiad.pdf site/gaiad.epub site/gaiad.docx site/gaiad.odt site/gaiad.txt site/gaiad.zip

      # One zip under each language directory (Emma, 2026-10-14: those versions "only contain English, Japanese,
      # Chinese, and then whatever ... other language the directory is in"): its GEDCOM keeps English, Chinese and
      # Japanese, adds Wikidata's labels in that language, and leaves out Korean (wiki-scripts/language_gedcom.py);
      # the books in it are the English text, in every format the root zip has.
      - name: Build the language zips
        run: |
          for lang in ja zh es hi ar fr ru uk; do
            d=/tmp/zip-$lang && rm -rf $d && mkdir -p $d
            python wiki-scripts/language_gedcom.py site/gaiad.ged $lang $d/gedcom.ged
            python wiki-scripts/gedcom_arms.py $d/gedcom.ged $d/gedcom.ged $d
            # portraits by URL here: 70 MB of JPEGs in every language zip would overrun the Pages artifact's 1 GB
            python wiki-scripts/gedcom_portraits.py $d/gedcom.ged $d/gedcom.ged
            cp site/gaiad.pdf site/gaiad.epub site/gaiad.docx site/gaiad.odt site/gaiad.txt $d/
            mkdir -p site/$lang
            (cd $d && zip -q -r -9 "$GITHUB_WORKSPACE/site/$lang/gaiad.zip" .)
          done
          ls -la site/*/gaiad.zip
          # Every language's generated names (composed from the Wikidata name items; make_composed_names.py), in one
          # table beside gaiad.ged: the language GEDCOMs above carry only their own language from it.
          cp wikibase/analysis/composed_names.tsv site/gaiad-generated-names.tsv
          # The same for the people with no Wikidata id, from name items matched to the written name
          # (make_matched_names.py), kept in a table of its own.
          cp wikibase/analysis/matched_names.tsv site/gaiad-generated-names-matched.tsv
          # The bare /gaiad.ged names the portraits by their URL on the site (the zips carry the files).
          python wiki-scripts/gedcom_portraits.py site/gaiad.ged site/gaiad.ged

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
